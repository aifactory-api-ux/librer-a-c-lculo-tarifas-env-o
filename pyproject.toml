[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping"
version = "0.1.0"
description = "Small Python library to compute parcel shipping rates."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["shipping"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
